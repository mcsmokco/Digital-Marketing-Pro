<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المحادثات — Digital Marketing Pro</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="chat.css?v=20261004-3"><link rel="stylesheet" href="chat-mobile.css?v=20261002-2"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="admin-role.js"></script></head><body class="chat-page"><main class="chat-shell"><header class="chat-header"><a href="index.html" class="back">← الموقع</a><div><span class="eyebrow">COMMUNITY</span><h1>💬 المحادثات</h1><p id="chatUserStatus">جاري التحقق...</p></div><button id="chatNotificationsBtn" class="chat-notify-btn" type="button" aria-label="الإشعارات" aria-expanded="false">🔔<span id="notificationBadge" hidden>0</span></button></header><section class="chat-tabs"><button class="chat-tab active" data-room="public">🌍 العام</button><button class="chat-tab" data-room="admin" hidden>🛡️ الإدارة</button></section><section id="chatNotifications" class="chat-notifications" hidden></section><section class="chat-card"><div id="chatNotice" class="chat-notice" hidden></div><div id="replyBar" class="chat-context-bar" hidden></div><div id="editBar" class="chat-context-bar" hidden>✏️ تعديل الرسالة <button id="cancelEdit" type="button">إلغاء</button></div><div id="messages" class="messages"><div class="chat-empty">جاري تحميل الرسائل...</div></div><form id="chatForm" class="chat-form"><div class="chat-input-wrap"><div id="mentionSuggestions" class="mention-suggestions" hidden></div><div id="emojiPicker" class="emoji-picker" hidden></div><textarea id="messageInput" maxlength="2000" rows="1" autocomplete="off" placeholder="اكتب رسالتك... @ للمنشن • Enter للإرسال • Shift+Enter لسطر جديد" required></textarea></div><button id="emojiBtn" class="chat-tool-btn" type="button" title="إيموجي" aria-label="فتح الإيموجي" aria-expanded="false">😊</button><button type="submit">إرسال ➤</button><button id="cancelReply" class="chat-cancel-reply" type="button" hidden>إلغاء الرد</button></form></section></main><script src="chat-interactions.js?v=20261004-3"></script><script>
(function(){
  function setupEmojiFallback(){
    const btn=document.getElementById('emojiBtn');
    const picker=document.getElementById('emojiPicker');
    const input=document.getElementById('messageInput');
    if(!btn||!picker||!input)return;
    const emojis=['😀','😃','😄','😁','😆','😅','😂','🤣','😊','😇','🙂','🙃','😉','😍','🥰','😘','😎','🤔','😢','😭','😡','🤯','👍','👏','🙏','❤️','🔥','🎉','✨','💯','👑','🚀','💪','🤝','❤️‍🔥'];
    if(!picker.dataset.fallbackReady){
      picker.innerHTML=emojis.map(e=>'<button type="button" class="emoji-choice" data-fallback-emoji="'+e+'">'+e+'</button>').join('');
      picker.dataset.fallbackReady='1';
      picker.addEventListener('click',function(e){
        const b=e.target.closest('[data-fallback-emoji]');
        if(!b)return;
        e.preventDefault();
        e.stopPropagation();
        const a=input.selectionStart??input.value.length;
        const c=input.selectionEnd??input.value.length;
        input.value=input.value.slice(0,a)+b.dataset.fallbackEmoji+input.value.slice(c);
        input.selectionStart=input.selectionEnd=a+b.dataset.fallbackEmoji.length;
        input.dispatchEvent(new Event('input',{bubbles:true}));
        input.focus();
      });
    }
    if(btn.dataset.fallbackBound)return;
    btn.dataset.fallbackBound='1';
    btn.addEventListener('click',function(e){
      e.preventDefault();
      e.stopImmediatePropagation();
      const open=picker.hidden;
      picker.hidden=!open;
      picker.style.display=open?'grid':'none';
      picker.style.visibility=open?'visible':'hidden';
      picker.style.opacity=open?'1':'0';
      picker.classList.toggle('open',open);
      btn.setAttribute('aria-expanded',String(open));
    },true);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setupEmojiFallback,{once:true});
  else setupEmojiFallback();
})();
</script></body></html>
